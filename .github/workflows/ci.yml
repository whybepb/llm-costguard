name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Unit tests + deterministic gates: exact/semantic cache replay (memoized judge verdicts),
  # window fact coverage. No API calls; a PR that regresses any bound fails here.
  gates:
    runs-on: ubuntu-latest
    env:
      COSTGUARD_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/costguard.toml') }}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - run: python -m pytest -q tests

  # Held-out LLM quality gate on eval_data. Answers and grades are memoized in
  # results/e2e__api_memo.json, so an unchanged pipeline replays for free. A PR that
  # changes prompts, windowing or routing produces new prompts: with the
  # ANTHROPIC_API_KEY secret set those calls run under a spend cap, without it the
  # job fails and says which call was missing.
  llm-gate:
    runs-on: ubuntu-latest
    needs: gates
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COSTGUARD_MAX_NEW_COST_USD: "1.50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/costguard.toml') }}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Run e2e on eval_data (memo first)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then export COSTGUARD_OFFLINE=1; fi
          python -m e2e.run --data eval_data --variants optimized_w800 --prefix ci_evalset
      - name: Gate
        run: python -m gates.llm results/ci_evalset__cost_vs_quality_summary.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evalset-results
          path: results/ci_evalset__*.csv
