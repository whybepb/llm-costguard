[project]
name = "llm-costguard"
version = "0.1.0"
description = "A drop-in, OpenAI-compatible layer that cuts LLM spend with exact + semantic caching, context trimming, prompt compression and eval-gated model downshift."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]", "pydantic>=2.7", "pyyaml", "numpy", "httpx",
  "tiktoken", "fastembed", "qdrant-client", "litellm", "prometheus-client", "pandas", "pyarrow",
]

[project.optional-dependencies]
local = ["mlx-lm"]                 # Apple-silicon local models (free, real generations)
compress = ["llmlingua"]           # LLMLingua-2 compressor (offline / beefy hosts)
dashboard = ["streamlit"]
dev = ["pytest", "pytest-asyncio", "locust", "huggingface_hub", "datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
