# CostGuard policy: versioned in git. Its hash is logged on every request (config_hash), so every number traces to a config.
# Values below are calibrated from eval/results/threshold_sweep.json and compression_eval.json (comments cite the numbers).
version: 1
default_mode: balanced
kb_version: kb-v1                      # bump when the knowledge base changes -> new cache partition (invalidates semantic cache)
system_prompt_file: configs/prompts/system_v1.txt
default_max_tokens: 256

# Which concrete model each tier maps to, per backend. Tiers ("strong"/"cheap") are what the pipeline reasons about.
backends:
  anthropic: {strong: claude-sonnet-5-5, cheap: claude-haiku-4-5-20251001}   # real API (default for experiments)
  mock:   {strong: mock-strong, cheap: mock-cheap}
  mlx:    {strong: mlx-community/Qwen2.5-7B-Instruct-4bit, cheap: mlx-community/Qwen2.5-1.5B-Instruct-4bit}
  openai: {strong: gpt-5.4-mini, cheap: gpt-5-nano}
  gemini: {strong: gemini/gemini-2.5-flash, cheap: gemini/gemini-2.5-flash-lite}

# What each tier is billed as (list-price equivalent). Local/free models are priced as the API model they stand in for.
billing:
  strong: gpt-5.4-mini
  cheap: gpt-5-nano
billing_by_backend:            # real APIs are billed at their own list prices
  anthropic: {strong: claude-sonnet-5.5, cheap: claude-haiku-4.5}
  openai:    {strong: gpt-5.4-mini, cheap: gpt-5-nano}
  gemini:    {strong: gemini-2.5-flash, cheap: gemini-2.5-flash-lite}

# Service-side tenancy: CostGuard runs inside the operator's infrastructure; callers are the operator's own backend
# services, never end users. Tenant + mode come from the caller's API key (COSTGUARD_API_KEYS="key:tenant,..."),
# not from the request body. Body hints (category, context) are accepted; mode/tenant overrides only if allowed.
tenants:
  default:          {mode: balanced, allow_mode_override: true}    # local dev / no keys configured
  shopnest-support: {mode: balanced, allow_mode_override: false}   # production support bot: ops sets the policy
  shopnest-internal: {mode: quality, allow_mode_override: true}    # internal tools / eval harness

cache:
  max_temperature: 0.3          # don't cache creative/high-temperature requests
  single_turn_only: true        # multi-turn answers depend on history -> bypass
  ttl_seconds: 604800           # 7 days
  embedding_model: BAAI/bge-small-en-v1.5   # thresholds below are calibrated for THIS model only
  guards: {numbers: true, negation: true, entities: true}   # cheap deterministic false-hit guards

modes:
  "off":
    exact_cache: false
    semantic_cache: false
    context: false
    compression: false
    router: false
  quality:
    exact_cache: true
    semantic_cache: true
    tau: 0.95                    # sweep: 0.94 meets 0.5% false-hit budget; 0.95 keeps its 95% upper bound inside
    context: true
    context_budget_tokens: 1600  # compression_eval: evidence retention 98.2% (bar >= 98%)
    context_min_score: null
    compression: false           # rate 0.7 gives the same retention, so not worth the risk in quality mode
    router: false
  balanced:
    exact_cache: true
    semantic_cache: true
    tau: 0.93                    # sweep: per-request false-hit <= 1% (0.34-0.84%)
    context: true
    context_budget_tokens: 1000  # compression_eval: rerank 1000 + heuristic 0.5 -> retention 96.4% (bar >= 95%)
    context_min_score: null
    compression: true
    compression_rate: 0.5        # keep ~50% of context tokens (heuristic extractive). LLMLingua-2 at the same rate kept only 51.8% of the needed facts
    compression_min_tokens: 400  # don't bother below this
    router: true
    router_policy: gated         # downshift only categories that passed the eval gate
  economy:
    exact_cache: true
    semantic_cache: true
    tau: 0.89                    # sweep: per-request false-hit <= 3% (1.56-2.54%)
    context: true
    context_budget_tokens: 800   # compression_eval: 800 + 0.5 -> retention 92.9% (bar >= 90%); 0.33 fell to 85.7%
    context_min_score: null
    compression: true
    compression_rate: 0.5
    compression_min_tokens: 250
    router: true
    router_policy: aggressive    # downshift unless the request looks hard
